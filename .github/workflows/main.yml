name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www/fonts www/icons
          cp index.html app.js styles.css www/
          for w in 300 400 500 600 700; do cp node_modules/@fontsource/inter/files/inter-latin-$w-normal.woff2 www/fonts/inter-$w.woff2; done
          for w in 500 700 800; do cp node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-$w-normal.woff2 www/fonts/jetbrains-mono-$w.woff2; done
          pip install pillow
          cd www && python3 ../icons.py
      - run: rm -rf android
      - run: npx cap add android
      - run: python3 native.py
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: ls -la android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: FlipClock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
